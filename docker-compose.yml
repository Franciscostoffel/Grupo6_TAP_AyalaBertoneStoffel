services:
  db:
    image: postgres:16
    container_name: inversion-postgres
    environment:
      POSTGRES_DB: investments
      POSTGRES_USER: inversion
      POSTGRES_PASSWORD: inversion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inversion -d investments"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: inversion-inteligente
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-postgresql://inversion:inversion@db:5432/investments}
      APP_ENV: ${APP_ENV:-development}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
